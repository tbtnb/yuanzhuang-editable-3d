<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f1e8"><meta name="description" content="东窗小筑：根据客厅照片重建的温馨3D布局小游戏。平面拖动家具与植物，切换推荐布局，在浏览器里收藏自己的家。"><title>东窗小筑 · 把家摆成喜欢的样子</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%2354725b'/%3E%3Cpath d='M18 42V28L32 16l14 12v18H29V34M29 36c0-15 16-13 16-13 0 13-9 14-16 13' stroke='%23f5edda' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3C/svg%3E"><link rel="stylesheet" href="styles.css?v=3.0"><link rel="stylesheet" href="revision.css?v=3.0"><link rel="stylesheet" href="mobile-ui.css?v=3.0"></head>
<body>
<header class="header"><a class="brand" href="#" aria-label="东窗小筑首页"><span class="brandmark" data-icon="homeleaf"></span><span><strong>东窗小筑</strong><small>EAST WINDOW STUDIO</small></span></a><div class="breadcrumb">我的客厅 <span>/</span> 布局工作室 <i class="beta">新视角 · v3</i></div><div class="header-actions"><span id="saveStatus" class="save-status"><i></i> 已保存到此浏览器</span><button class="icon-button" id="helpBtn" title="使用说明" aria-label="使用说明" data-icon="help"></button><button class="button subtle" id="captureBtn"><span data-icon="camera"></span><span class="desktop-text">拍张照片</span></button><button class="button primary" id="saveBtn"><span data-icon="save"></span><span>收藏方案</span></button></div></header>
<main class="workspace">
<aside class="sidebar" id="sidebar"><div class="sidebar-intro"><div class="eyebrow">A LITTLE ROOM, A LOT OF JOY</div><h1>家的另一种可能<span>。</span></h1><p>挪一盆绿植，换一种日常。</p></div><div class="tabs" role="tablist"><button class="tab active" data-tab="layouts" role="tab" aria-selected="true">布局灵感</button><button class="tab" data-tab="objects" role="tab" aria-selected="false">物品清单</button><button class="tab" data-tab="plants" role="tab" aria-selected="false">植物图鉴</button></div><div class="sidebar-content" id="sideContent"></div><div class="sidebar-footer"><span data-icon="ruler"></span><span><b id="roomSize">约 5.8 × 6.6 m</b> <small>照片估算 · 非测量图纸</small></span><button id="infoBtn" aria-label="重建说明" data-icon="info"></button></div></aside>
<section class="stage" id="stage" aria-label="可以拖动家具的三维客厅"><canvas id="roomCanvas" tabindex="0" aria-label="3D 客厅：拖动物品进行平面移动，拖动空白处旋转视角"></canvas><div class="stage-heading"><div class="room-kicker"><i></i> YOUR LIVING ROOM</div><h2>一室绿意，满窗晨光</h2><div class="room-meta"><span data-icon="sun"></span>东向飘窗<span class="separator">·</span><span id="currentLayout">照片原位</span></div></div><div class="light-switch segmented" role="group" aria-label="灯光氛围"><button class="active" data-light="morning"><span data-icon="sunrise"></span>晨光</button><button data-light="day"><span data-icon="sun"></span>日间</button><button data-light="night"><span data-icon="moon"></span>暖夜</button></div>
<div class="projection-toolbar" role="group" aria-label="投影与幕布控制"><button id="screenToggle" aria-pressed="true">收起幕布</button><button id="projectorToggle" aria-pressed="false">开启投影</button><button id="cinemaView">看幕布</button><button id="photoView">新视角</button></div>
<div class="compass" title="E 为照片中已知的东向窗；其余方向按房间正交关系示意"><svg viewBox="0 0 72 72"><circle cx="36" cy="36" r="26" fill="none" stroke="currentColor" opacity=".25"/><path id="compassArrow" d="M36 13L42 39 36 35 30 39Z" fill="currentColor"/><text x="36" y="69" text-anchor="middle">E · 东窗</text></svg></div>
<div class="stage-tools"><button class="tool active" id="moveMode" title="布置模式：拖动物品" aria-label="布置模式" data-icon="move"></button><button class="tool" id="orbitMode" title="环绕模式：拖动旋转" aria-label="环绕模式" data-icon="orbit"></button><span class="tool-divider"></span><button class="tool" id="zoomIn" title="放大" aria-label="放大" data-icon="plus"></button><button class="tool" id="zoomOut" title="缩小" aria-label="缩小" data-icon="minus"></button><button class="tool" id="resetView" title="回到默认视角" aria-label="回到默认视角" data-icon="home"></button></div>
<div class="selection-label" id="selectionLabel" hidden><span id="selectionName"></span><small>拖动摆放</small></div><div class="plant-labels" id="plantLabels"></div><button class="screen-pin" id="screenPin" title="选择投影幕布">投影幕布</button><div class="stage-bottom"><div class="view-switch segmented"><button class="active" id="isoView"><span data-icon="cube"></span>立体</button><button id="topView"><span data-icon="plan"></span>俯视</button></div><div class="stage-shortcuts"><button id="undoBtn" title="撤销 Ctrl / ⌘ Z" aria-label="撤销" data-icon="undo"></button><button id="redoBtn" title="重做 Ctrl / ⌘ Shift Z" aria-label="重做" data-icon="redo"></button><span></span><label title="拖动时吸附到 10cm 网格"><input type="checkbox" id="snapToggle" checked>网格吸附</label><button id="optionsBtn" title="场景显示选项" aria-label="场景显示选项" data-icon="sliders"></button></div></div>
<div class="hint" id="hint"><span data-icon="hand"></span><span>直接拖动物品摆放<span class="hint-extra"> · 拖动空白处环绕 · 滚轮缩放</span></span></div><div class="scene-note">新视角校准 · 白色设备为音响 · 尺寸仍为估算</div><div class="loading" id="loading"><div class="loading-leaf" data-icon="leaf"></div><strong>正在把家装进小世界…</strong><small>每一片叶子，都有自己的位置。</small></div><button class="mobile-library button" id="mobileLibrary"><span data-icon="grid"></span>布局与物品</button>
</section>
<aside class="inspector" id="inspector"><div class="inspector-top"><span class="eyebrow">MAKE IT YOURS</span><button id="closeInspector" title="取消选择" aria-label="取消选择" data-icon="close"></button></div><div id="inspectorContent"></div><div class="inspector-foot"><span data-icon="lock"></span>仅在平面移动，高度随承载面锁定</div></aside>
</main><footer class="app-footer"><span>慢慢摆，家会长成喜欢的样子。</span><span id="objectCount"></span><button id="exportBtn">导出布局</button><button id="importBtn">导入布局</button><input id="fileInput" type="file" accept=".json,application/json" hidden></footer>
<div class="toast" id="toast" role="status" aria-live="polite"></div><dialog id="dialog"><div class="dialog-header"><span id="dialogTitle"></span><button id="dialogClose" aria-label="关闭" data-icon="close"></button></div><div id="dialogBody"></div></dialog>
<noscript><p class="noscript">请启用 JavaScript 来打开互动客厅。</p></noscript>
<script src="engine.js"></script><script src="room.js"></script><script src="compat.js"></script><script src="revision.js?v=3.0"></script><script src="room-v3.js?v=3.0"></script><script src="app.js?v=3.0"></script><script src="mobile-ui.js?v=3.0"></script>
</body></html>
